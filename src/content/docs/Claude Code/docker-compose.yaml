services:

  # ========================
  # OpenTelemetry Collector
  # ========================
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    environment:
      - TZ=Asia/Shanghai
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./otel-config.yaml:/etc/otel/config.yaml
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    depends_on:
      - jaeger
      - loki
      - prometheus

  # ========================
  # Jaeger (v2 all-in-one)
  # ========================
  jaeger:
    image: jaegertracing/jaeger:2.16.0
    environment:
      - TZ=Asia/Shanghai
    ports:
      - "16686:16686"   # UI
      # - "4317:4317"     # OTLP

  # ========================
  # Loki
  # ========================
  loki:
    image: grafana/loki:3.6.0
    environment:
      - TZ=Asia/Shanghai
    user: root  
    command: -config.file=/etc/loki/config.yaml
    volumes:
      - ./loki-config.yaml:/etc/loki/config.yaml
    ports:
      - "3100:3100"

  # ========================
  # Prometheus
  # ========================
  prometheus:
    image: prom/prometheus:latest
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yaml
    command:
      - "--config.file=/etc/prometheus/prometheus.yaml"
    ports:
      - "9090:9090"

  # ========================
  # Grafana
  # ========================
  grafana:
    image: grafana/grafana:latest
    environment:
      - TZ=Asia/Shanghai
    ports:
      - "3000:3000"
    depends_on:
      - loki
      - prometheus
      - jaeger